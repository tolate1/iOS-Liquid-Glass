<!doctype html>
<html lang="en" data-lg-theme="neutral-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workspace example</title>
  <link rel="stylesheet" href="/dist/styles.css">
  <link rel="stylesheet" href="./workspace.css">
  <script type="importmap">
    { "imports": { "@ios-liquid-glass/web": "/dist/index.js" } }
  </script>
  <script type="module" src="./workspace.js"></script>
</head>
<body>
  <main class="lg-dock-layout">
    <header class="workspace-header">
      <div><a class="workspace-back" href="/">Gallery</a><h1>Workspace</h1></div>
      <button id="details-trigger" class="lg-button" type="button">Workspace info</button>
    </header>
    <div class="workspace-navigation">
      <div id="views-tabs" class="lg-dock" aria-label="Workspace section">
        <button id="view-chat" type="button" class="lg-button" data-lg-value="chat">Chat</button>
        <button id="view-files" type="button" class="lg-button" data-lg-value="files">Files</button>
        <button id="view-project" type="button" class="lg-button" data-lg-value="project">Project</button>
      </div>
    </div>
    <div id="workspace-info">
      <p>Local demo workspace.</p>
      <button type="button" id="close-info" class="lg-button" autofocus>Close</button>
    </div>
    <div id="views">
      <section id="chat" tabindex="0">
        <h2>Chat</h2>
        <ul id="messages" aria-live="polite"><li>Welcome. The handoff is ready.</li></ul>
        <form class="actions">
          <label>Message <input class="lg-field" id="message" required></label>
          <button class="lg-button" type="submit">Send</button>
        </form>
      </section>
      <section id="files" tabindex="0" hidden>
        <h2>Files</h2>
        <label>Search files <input type="search" id="file-search" class="lg-field"></label>
        <ul id="files-list"><li>Handoff.md</li><li>Layout-notes.txt</li><li>Checklist.md</li></ul>
        <p id="files-empty" hidden>No matching files.</p>
      </section>
      <section id="project" tabindex="0" hidden>
        <h2>Project</h2>
        <p>Next milestone is the design review.</p>
      </section>
    </div>
  </main>
</body>
</html>
